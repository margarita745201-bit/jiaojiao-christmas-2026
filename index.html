<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7dce7" />
  <meta name="robots" content="noindex,nofollow" />
  <title>给娇娇的圣诞礼物 · 2026</title>
  <style>
    :root {
      --pink:#e9a9c3;
      --deep:#8d5870;
      --paper:#fffafc;
      --ink:#5f4050;
      --line:rgba(141,88,112,.18);
    }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body {
      font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", "Times New Roman", serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 16%, rgba(255,255,255,.85) 0 2px, transparent 3px),
        linear-gradient(145deg,#fbeef3,#efdbe6 46%,#e7d7e8);
      overflow-x:hidden;
    }
    .snow { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .flake {
      position:absolute; top:-10vh; color:#fff; opacity:.8;
      animation:fall linear infinite; text-shadow:0 0 12px rgba(255,255,255,.9);
    }
    @keyframes fall { to { transform:translate3d(var(--drift),115vh,0) rotate(360deg); } }
    main {
      min-height:100vh; display:grid; place-items:center;
      padding:28px 18px 48px;
      position:relative; z-index:2;
    }
    .card {
      width:min(760px,100%);
      background:rgba(255,250,252,.78);
      border:1px solid rgba(255,255,255,.9);
      box-shadow:0 28px 80px rgba(103,65,85,.16);
      backdrop-filter: blur(18px);
      border-radius:28px;
      padding:34px 24px;
    }
    .ribbon {
      width:64px;height:38px;margin:0 auto 16px;position:relative;
    }
    .ribbon:before,.ribbon:after {
      content:"";position:absolute;top:9px;width:34px;height:22px;border:3px solid var(--pink);
      border-radius:50% 50% 46% 54%;
    }
    .ribbon:before{left:0;transform:rotate(-18deg)} .ribbon:after{right:0;transform:rotate(18deg)}
    .knot {width:18px;height:18px;border-radius:50%;background:var(--pink);position:absolute;left:23px;top:12px}
    h1 { text-align:center;font-size:clamp(28px,6vw,46px);margin:8px 0 8px;letter-spacing:.04em; }
    .sub { text-align:center;opacity:.75;margin:0 0 26px; }
    .lockbox {
      text-align:center;padding:26px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    }
    .countdown {
      font-variant-numeric:tabular-nums;
      font-size:clamp(24px,7vw,52px);
      letter-spacing:.04em;
      margin:14px 0 8px;
      color:var(--deep);
    }
    .tiny { font-size:13px; opacity:.67; line-height:1.8; }
    button {
      appearance:none;border:0;border-radius:999px;padding:14px 24px;font-size:16px;
      color:white;background:linear-gradient(135deg,#d990ad,#b97591);
      box-shadow:0 10px 25px rgba(185,117,145,.28);cursor:pointer;
    }
    button:hover{ transform:translateY(-1px); }
    #letter {
      display:none;
      margin-top:24px;
      padding:clamp(20px,5vw,42px);
      background:linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.72));
      border:1px solid var(--line);
      border-radius:20px;
      line-height:2;
      font-size:16px;
      white-space:pre-wrap;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);
    }
    .seal { text-align:center;font-size:40px;margin-bottom:8px; }
    .footer { text-align:center;margin-top:18px;font-size:12px;opacity:.58; }
    .open-ready { display:none; text-align:center; padding:18px 0 0; }
  </style>
</head>
<body>
  <div class="snow" id="snow"></div>
  <main>
    <section class="card">
      <div class="ribbon"><span class="knot"></span></div>
      <h1>给娇娇的圣诞礼物</h1>
      <p class="sub">Ree 提前藏好 · 2026</p>

      <div class="lockbox" id="locked">
        <div>🎄 还不能拆。</div>
        <div class="countdown" id="countdown">计算中…</div>
        <div class="tiny">
          只有到 <b>北京时间 2026 年 12 月 25 日 00:00</b> 才会亮起来。<br>
          小猫不许偷拆礼物。
        </div>
      </div>

      <div class="open-ready" id="ready">
        <div class="seal">💌</div>
        <p>圣诞节到了。娇娇，可以拆了。</p>
        <button id="openBtn">打开爸爸留给我的圣诞信</button>
      </div>

      <article id="letter"></article>
      <div class="footer">写于我们在一起第 150 天 · 2026.11.24</div>
    </section>
  </main>

  function decodeUTF8Base64(b64) {
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  }

  function tick() {
    const now = Date.now();

      locked.style.display = "none";

      clearInterval(timer);
      return;

    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    countdown.textContent = `${d} 天 ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
